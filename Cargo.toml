[package]
name = "ink"
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/dkarter/ink"
description = "A fast, composable terminal input prompt with Vim editing"

[dependencies]
atomic-write-file = "0.3.1"
crossterm = { version = "0.29", features = ["use-dev-tty"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
syn = { version = "3", features = ["full"] }
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }
toml_edit = "0.25.4"
unicode-segmentation = "1.12"
unicode-width = "0.2.2"
usage = { version = "6", package = "usage-rs", features = ["completions"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
portable-pty = "0.9"
serde_json = "1.0.151"
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
crossterm_winapi = "0.9.1"
