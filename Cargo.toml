[package]
name = "ink"
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/dkarter/ink"
description = "A fast, composable terminal input prompt with Vim editing"

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
syn = { version = "2", features = ["full"] }
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }
unicode-segmentation = "1.12"
unicode-width = "0.2.2"
usage = { version = "6", package = "usage-rs", features = ["completions"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
