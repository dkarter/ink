name: Release Please

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release-context.outputs.active }}
      release_sha: ${{ steps.release-context.outputs.release_sha }}
      tag_verified: ${{ steps.verify-tag.outputs.verified }}
      tag_name: ${{ steps.release-context.outputs.tag_name }}
      version: ${{ steps.release-context.outputs.version }}
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify triggering commit is current main
        id: verify
        env:
          TRIGGERING_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/main
          if [[ "${TRIGGERING_SHA}" == "$(git rev-parse FETCH_HEAD)" ]]; then
            echo "current=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Generate release app token
        id: release_app_token
        if: ${{ steps.verify.outputs.current == 'true' }}
        # v3.2.0 is an immutable GitHub release.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Prepare release
        id: release
        if: ${{ steps.verify.outputs.current == 'true' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # App-authored release PRs trigger the pull_request CI workflow.
          token: ${{ steps.release_app_token.outputs.token }}

      - name: Resolve new or unfinished release
        id: release-context
        if: ${{ steps.verify.outputs.current == 'true' }}
        shell: bash
        env:
          ACTION_RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          ACTION_RELEASE_SHA: ${{ steps.release.outputs.sha }}
          ACTION_TAG_NAME: ${{ steps.release.outputs.tag_name }}
          ACTION_VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${ACTION_RELEASE_CREATED}" == "true" ]]; then
            release_sha="${ACTION_RELEASE_SHA}"
            tag_name="${ACTION_TAG_NAME}"
            version="${ACTION_VERSION}"
          else
            version="$(jq -r '.["."]' .release-please-manifest.json)"
            tag_name="v${version}"
            if ! release_json="$(gh release view "${tag_name}" --json isDraft,targetCommitish)"; then
              exit 0
            fi
            if [[ "$(jq -r '.isDraft' <<< "${release_json}")" != "true" ]]; then
              exit 0
            fi
            release_sha="$(jq -r '.targetCommitish' <<< "${release_json}")"
          fi
          {
            echo "active=true"
            echo "release_sha=${release_sha}"
            echo "tag_name=${tag_name}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify release tag targets release commit
        id: verify-tag
        if: ${{ steps.release-context.outputs.active == 'true' }}
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.release-context.outputs.release_sha }}
          TAG_NAME: ${{ steps.release-context.outputs.tag_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
          tag_commit="$(git rev-parse "${TAG_NAME}^{commit}")"
          if [[ "${tag_commit}" != "${RELEASE_SHA}" ]]; then
            echo "::error::Release tag ${TAG_NAME} targets ${tag_commit}, not release commit ${RELEASE_SHA}"
            exit 1
          fi
          echo "verified=true" >> "${GITHUB_OUTPUT}"

  build-release:
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_verified == 'true' }}
    needs: release-please
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: x86_64
            target: x86_64-unknown-linux-musl
            extension: ""
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            target: aarch64-unknown-linux-musl
            extension: ""
            archive: tar.gz
          - runner: macos-15
            os: darwin
            arch: arm64
            target: aarch64-apple-darwin
            extension: ""
            archive: tar.gz
          - runner: windows-2025
            os: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
            extension: .exe
            archive: zip
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.release_sha }}

      - name: Install Rust build tools
        # v4.3.0 is an immutable GitHub release.
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: rust mr-boxington

      - name: Add release target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl linker
        if: ${{ matrix.os == 'linux' }}
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }} --bin ink

      - name: Package release asset
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          ARCHIVE: ${{ matrix.archive }}
          EXTENSION: ${{ matrix.extension }}
          OS: ${{ matrix.os }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          asset="ink_${VERSION}_${OS}_${ARCH}.${ARCHIVE}"
          mkdir -p dist/package
          cp "target/${TARGET}/release/ink${EXTENSION}" dist/package/
          cp README.md LICENSE dist/package/
          if [[ "${ARCHIVE}" == "zip" ]]; then
            (cd dist/package && 7z a "../${asset}" '*')
          else
            tar -C dist/package -czf "dist/${asset}" .
          fi

      - name: Reverify release tag before asset upload
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.release_sha }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags --depth=1 origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
          tag_commit="$(git rev-parse "${TAG_NAME}^{commit}")"
          if [[ "${tag_commit}" != "${RELEASE_SHA}" ]]; then
            echo "::error::Release tag ${TAG_NAME} targets ${tag_commit}, not release commit ${RELEASE_SHA}"
            exit 1
          fi

      - name: Upload asset to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "${TAG_NAME}" dist/ink_* --clobber

  publish-release:
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_verified == 'true' }}
    needs:
      - release-please
      - build-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.release_sha }}

      - name: Reverify release tag before publication
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.release_sha }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
          tag_commit="$(git rev-parse "${TAG_NAME}^{commit}")"
          if [[ "${tag_commit}" != "${RELEASE_SHA}" ]]; then
            echo "::error::Release tag ${TAG_NAME} targets ${tag_commit}, not release commit ${RELEASE_SHA}"
            exit 1
          fi

      - name: Publish release after all assets are uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "${TAG_NAME}" --draft=false
